# .github/workflows/release.yml

name: Build and Release Alou

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Validate and build .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3

      - name: Lint shell scripts
        run: shellcheck alou/usr/local/bin/alou alou/usr/local/bin/alou-gui alou/usr/local/alou/*.sh alou/etc/profile.d/alou.sh alou/DEBIAN/postinst alou/DEBIAN/prerm alou/DEBIAN/postrm alou/build_deb.sh

      - name: Compile GUI
        run: python3 -m py_compile alou/usr/local/alou/gui/alou_gui.py

      - name: Build package
        id: package
        working-directory: alou
        run: |
          ./build_deb.sh
          version="$(awk '/^Version:/{print $2}' DEBIAN/control)"
          mv ../alou.deb "../alou_${version}_all.deb"
          echo "deb_name=alou_${version}_all.deb" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.deb_name }}
          path: ${{ steps.package.outputs.deb_name }}

  release:
    name: Release .deb
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute release metadata
        id: meta
        run: |
          deb="$(find dist -name 'alou_*_all.deb' -print -quit)"
          version="$(basename "$deb" | sed -E 's/^alou_([^_]+)_all\.deb$/\1/')"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.meta.outputs.deb }}
